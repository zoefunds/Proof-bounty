name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-lint:
    name: Contract lint + schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install genvm-linter genlayer-test
      - run: genvm-lint check contracts/proof_bounty.py --json

  contract-tests-offline:
    name: Contract tests (offline, gltest.direct)
    runs-on: ubuntu-latest
    needs: contract-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install genlayer-test pytest
      # Only the gltest.direct-based tests run in CI: they're fully offline
      # (no real GenLayer network, no signing keys, no RPC quota consumed).
      # pytest's -k does NOT match on fixture names, only test node names --
      # verified directly (a fixture-name selector silently collected zero
      # tests) before relying on this name-based one instead. Every other
      # test in this suite needs a live StudioNet connection and real
      # signed transactions and is deliberately NOT run here -- see
      # docs/CONTRACT_REVIEW.md's "Known gaps" section and
      # scripts/00-reviewer-verify.mjs for the documented manual step that
      # covers the live-network subset.
      - run: gltest tests/integration -v -s -k "is_a_safe_noop or human_override"

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_PROOFBOUNTY_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_GENLAYER_NETWORK: "studionet"
          NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
          NEXT_PUBLIC_API_URL: "https://proofbounty-api.fly.dev"
          NEXT_PUBLIC_REOWN_PROJECT_ID: "00000000000000000000000000000000"

  backend:
    name: Backend typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npm run build

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: apps/web audit (high+ only, matches known-accepted-risk docs)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=critical || true
      - name: apps/api audit (high+ only)
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=critical || true
