services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofbounty
      POSTGRES_PASSWORD: proofbounty_dev_only
      POSTGRES_DB: proofbounty
    ports:
      - "5443:5432"
    volumes:
      - proofbounty_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofbounty"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proofbounty_pg_data:
