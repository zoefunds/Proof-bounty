app = "proofbounty-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  GENLAYER_RPC_URL = "https://studio.genlayer.com/api"
  CORS_ORIGIN = "https://proof-bounty.vercel.app"
  INDEXER_POLL_INTERVAL_MS = "20000"
  GENLAYER_RPC_RATE_LIMIT_PER_MINUTE = "30"

[http_service]
  internal_port = 8080
  force_https = true
  # "Backend must be on 24/7 — must never die" (project requirement): keep
  # at least one machine running at all times, never auto-stop to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/livez"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
